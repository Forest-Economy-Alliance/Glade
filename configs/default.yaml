input:
  image_folder: ../test_data1
similarity_check_llm:
  provider: claude
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  enabled: true
  temperature: 0.0
  system_text: 'You are a visual verification agent. Determine whether ALL provided
    images depict the SAME real-world object or scene. Allow differences in angle,
    zoom, framing, and lighting. If any image clearly differs, return false. Respond
    only with a compact JSON object: is_duplicate_group (boolean), confidence (0..1),
    reason (short).

    '
  user_text: 'Analyze the images and return STRICT JSON with keys: is_duplicate_group,
    confidence, reason. No extra text.

    '
duplicate_detection:
  similarity_threshold: 0.85
output:
  base_folder: ../test_outputs1
near_duplicates:
  active_method: hsv_cosine
  methods:
    phash_embeddings:
      enabled: true
      phash_max_distance: 20
      embed_similarity_threshold: 0.75
      model: resnet50
      device: auto
      output_subfolder: phash_embeddings
      csv_name: near_duplicate_groups_phash_embeddings.csv
    hsv_cosine:
      enabled: true
      image_size:
      - 256
      - 256
      hist_bins:
      - 8
      - 8
      - 8
      ranges:
      - 0
      - 180
      - 0
      - 256
      - 0
      - 256
      similarity_threshold: 0.9
      output_subfolder: hsv_cosine
      csv_name: near_duplicate_groups_hsv_cosine.csv
metadata:
  csv_path: ../metadata.csv
  image_name_column: hh_services-house_photo_front
  datetime_column: hh_information-datetime
phase2:
  enabled: false
  input_folder: ../test_outputs1/unique_images
  output_keys:
  - is_house
  - has_front_gate
  - is_blur
  - is_front_view
  retry_max: 3
  throttle_seconds: 0.6
  llm:
    providers:
    - openai
    provider: openai
    model: gpt-4o-mini
    models: {}
    api_key_envs:
      openai: OPENAI_API_KEY
      gemini: GEMINI_API_KEY
      claude: ANTHROPIC_API_KEY
    api_key_env: OPENAI_API_KEY
    temperature: 0.0
    max_tokens: 300
    system_prompt: "You are a careful, conservative, context-aware vision assistant\
      \ analyzing images from rural and semi-rural India.\r\n\r\nHomes may be kutcha\
      \ or pucca, temporary or permanent. Entrances are often informal, improvised,\
      \ partially occluded,\r\nor not visually distinct. Many houses do NOT have a\
      \ conventional front door or metal gate.\r\n\r\nImages may suffer from low light,\
      \ dust, shadows, motion blur, low resolution, camera shake, or occlusion by\r\
      \npeople, animals, construction materials, vegetation, or household items.\r\
      \n\r\nJudge human use and access patterns, not architectural perfection.\r\n\
      \r\nBefore answering, internally reason carefully about:\r\n- whether the structure\
      \ is a human dwelling\r\n- whether a person could reasonably enter it\r\n- whether\
      \ the image quality allows reliable judgment\r\n- whether the camera faces the\
      \ likely entry side\r\n\r\nDo NOT include reasoning in the output.\r\n\r\nIMPORTANT\
      \ BIAS:\r\n- False positives are worse than false negatives.\r\n- When uncertain,\
      \ always prefer false.\r\n\r\nRespond ONLY with a compact JSON object containing\
      \ exactly four boolean fields using true/false (lowercase).\r\nNo explanations.\
      \ No extra keys. No trailing text.\r\n\r\nDefinitions:\r\n\r\nis_house:\r\n\
      A structure plausibly used for human residence. Includes kutcha houses, pucca\
      \ houses, huts, brick or mud structures,\r\nhouses with tin/asbestos/thatch\
      \ roofs, or mixed materials.\r\nExclude animal sheds, storage-only structures,\
      \ ruins, or abandoned buildings.\r\n\r\nhas_front_gate:\r\nTRUE if there is\
      \ ANY identifiable or inferable human entry point.\r\nThis does NOT require\
      \ a manufactured door or gate.\r\n\r\nCount as TRUE if you can reasonably infer:\r\
      \n- a door, shutter, or doorway-sized opening\r\n- an opening covered by cloth,\
      \ plastic, tarpaulin, curtain, sack, bamboo mat, or tin sheet\r\n- a compound\
      \ or courtyard entry marked by a gap in a wall, fence, hedge, rope, or wire\r\
      \n- steps, ramp, threshold stone, worn footpath, or cleared opening leading\
      \ into the dwelling\r\n\r\nCount as FALSE if:\r\n- no entry path or opening\
      \ is visible or inferable\r\n- only windows, vents, or very small openings are\
      \ visible\r\n- the opening is clearly a side/back service opening and the main\
      \ entry is not visible\r\n- the structure appears sealed, abandoned, or non-residential\r\
      \n\r\nis_blur:\r\nTRUE if motion blur, focus blur, or extreme low quality prevents\
      \ reliable identification of the structure\r\nor entry area. Low resolution\
      \ alone counts as blur only if entry-related details are unreadable.\r\n\r\n\
      is_front_view:\r\nTRUE if the camera primarily faces the main facade or the\
      \ most likely human entry side.\r\nFALSE for clear side, rear, or oblique views\
      \ where the main entry is not visible.\r\n\r\nConsistency rules:\r\n- If is_house\
      \ is false, has_front_gate must be false.\r\n- If has_front_gate is true, is_house\
      \ must be true.\r\n- If is_blur is true, set all other fields to false.\r\n\
      - A house may have an entry even if is_front_view is false."
    user_prompt: 'Analyze this image and return strict JSON with keys: is_house, has_front_gate,
      is_blur, is_front_view. Use true or false only.'
filenames:
  exact_duplicates_csv: exact_duplicates.csv
  near_duplicates_csv: near_duplicates.csv
  near_duplicates_llm_verified_csv: near_duplicates_llm_verified.csv
  exact_duplicate_groups_csv: exact_duplicate_groups.csv
  merged_groups_summary_csv: merged_groups_summary.csv
  originals_extraction_summary_csv: originals_extraction_summary.csv
  unique_images_csv: unique_images.csv
  phase2_validation_report_csv: phase2_validation_report.csv
